<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0a0a0f;
    --bg2:#0d0d14;
    --cyan:#00f0ff;
    --gold:#ffd700;
    --red:#ff2a2a;
    --green:#00ff88;
    --text:#e0e0e0;
    --dim:#5a5a6a;
    --glow-cyan:0 0 20px rgba(0,240,255,.3),0 0 60px rgba(0,240,255,.1);
    --glow-gold:0 0 20px rgba(255,215,0,.3),0 0 60px rgba(255,215,0,.1);
    --glow-red:0 0 20px rgba(255,42,42,.3),0 0 60px rgba(255,42,42,.1);
  }
  html{scroll-behavior:smooth}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Rajdhani',sans-serif;
    min-height:100dvh;
    overflow-x:hidden;
    position:relative;
  }

  /* GRID BACKGROUND */
  body::before{
    content:'';
    position:fixed;
    inset:0;
    background:
      linear-gradient(rgba(0,240,255,.03) 1px,transparent 1px),
      linear-gradient(90deg,rgba(0,240,255,.03) 1px,transparent 1px);
    background-size:40px 40px;
    pointer-events:none;
    z-index:0;
  }
  body::after{
    content:'';
    position:fixed;
    inset:0;
    background:radial-gradient(ellipse at 50% 0%,rgba(0,240,255,.06) 0%,transparent 60%);
    pointer-events:none;
    z-index:0;
  }

  /* SCANLINE */
  .scanline{
    position:fixed;
    top:0;left:0;right:0;
    height:3px;
    background:linear-gradient(90deg,transparent,var(--cyan),transparent);
    opacity:.15;
    animation:scanDown 8s linear infinite;
    z-index:1;
    pointer-events:none;
  }
  @keyframes scanDown{
    0%{top:-3px}
    100%{top:100vh}
  }

  /* 17 DOTS EASTER EGG */
  .dots-17{
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    pointer-events:none;
    z-index:0;
    overflow:hidden;
  }
  .dots-17 span{
    position:absolute;
    width:3px;height:3px;
    background:var(--gold);
    border-radius:50%;
    opacity:.12;
    animation:dotPulse 4s ease-in-out infinite;
  }

  @keyframes dotPulse{
    0%,100%{opacity:.08;transform:scale(1)}
    50%{opacity:.2;transform:scale(1.5)}
  }

  /* MAIN CONTAINER */
  .hub{
    position:relative;
    z-index:2;
    max-width:420px;
    margin:0 auto;
    padding:28px 20px 40px;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* TOP BADGE */
  .badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:5px 14px;
    border:1px solid rgba(0,240,255,.2);
    border-radius:20px;
    font-size:.7rem;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--cyan);
    margin-bottom:18px;
    animation:fadeIn .8s ease both;
    background:rgba(0,240,255,.03);
  }
  .badge::before{
    content:'';
    width:6px;height:6px;
    background:var(--cyan);
    border-radius:50%;
    animation:blink 2s ease-in-out infinite;
  }
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

  /* AVATAR */
  .avatar-ring{
    width:110px;height:110px;
    border-radius:50%;
    padding:3px;
    background:conic-gradient(var(--cyan),var(--gold),var(--red),var(--cyan));
    margin-bottom:14px;
    animation:fadeIn 1s ease both,ringRotate 6s linear infinite;
    position:relative;
  }
  @keyframes ringRotate{
    0%{background:conic-gradient(from 0deg,var(--cyan),var(--gold),var(--red),var(--cyan))}
    100%{background:conic-gradient(from 360deg,var(--cyan),var(--gold),var(--red),var(--cyan))}
  }
  .avatar-ring img{
    width:100%;height:100%;
    border-radius:50%;
    object-fit:cover;
    display:block;
    border:3px solid var(--bg);
  }
  .avatar-placeholder{
    width:100%;height:100%;
    border-radius:50%;
    background:var(--bg2);
    border:3px solid var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Orbitron',sans-serif;
    font-weight:900;
    font-size:2rem;
    color:var(--cyan);
  }

  /* NAME & TITLE */
  .name{
    font-family:'Orbitron',sans-serif;
    font-weight:900;
    font-size:1.6rem;
    color:#fff;
    letter-spacing:2px;
    text-transform:uppercase;
    animation:fadeIn 1.1s ease both;
    text-align:center;
  }
  .title{
    font-size:.85rem;
    color:var(--dim);
    letter-spacing:2px;
    text-transform:uppercase;
    margin-top:4px;
    margin-bottom:6px;
    animation:fadeIn 1.2s ease both;
    text-align:center;
  }
  .tagline{
    font-size:.95rem;
    color:var(--gold);
    font-weight:600;
    letter-spacing:1px;
    margin-bottom:22px;
    animation:fadeIn 1.3s ease both;
    text-align:center;
  }

  /* PHONE */
  .phone-link{
    display:inline-flex;
    align-items:center;
    gap:8px;
    color:var(--text);
    text-decoration:none;
    font-size:.9rem;
    font-weight:500;
    letter-spacing:1.5px;
    margin-bottom:22px;
    transition:color .3s;
    animation:fadeIn 1.35s ease both;
  }
  .phone-link:hover{color:var(--cyan)}
  .phone-link svg{width:16px;height:16px;fill:var(--cyan)}

  /* CTA BUTTONS */
  .cta-stack{
    display:flex;
    flex-direction:column;
    gap:12px;
    width:100%;
    margin-bottom:28px;
  }
  .cta-btn{
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    padding:16px 20px;
    border-radius:10px;
    text-decoration:none;
    font-family:'Rajdhani',sans-serif;
    font-weight:700;
    font-size:1.05rem;
    letter-spacing:1px;
    text-transform:uppercase;
    transition:all .3s cubic-bezier(.22,1,.36,1);
    position:relative;
    overflow:hidden;
    cursor:pointer;
  }
  .cta-btn::before{
    content:'';
    position:absolute;
    inset:0;
    opacity:0;
    transition:opacity .3s;
  }
  .cta-btn:hover{transform:translateY(-2px)}
  .cta-btn:hover::before{opacity:1}
  .cta-btn:active{transform:translateY(0) scale(.98)}

  .cta-icon{
    width:36px;height:36px;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    position:relative;
    z-index:1;
  }
  .cta-icon svg{width:18px;height:18px}
  .cta-label{
    position:relative;z-index:1;
    display:flex;flex-direction:column;
  }
  .cta-label small{
    font-size:.65rem;
    font-weight:400;
    letter-spacing:1.5px;
    opacity:.7;
    margin-top:1px;
  }

  /* BUTTON VARIANTS */
  .cta-voice{
    background:rgba(0,240,255,.06);
    border:1px solid rgba(0,240,255,.2);
    color:var(--cyan);
  }
  .cta-voice:hover{border-color:var(--cyan);box-shadow:var(--glow-cyan)}
  .cta-voice::before{background:linear-gradient(135deg,rgba(0,240,255,.08),transparent)}
  .cta-voice .cta-icon{background:rgba(0,240,255,.1)}
  .cta-voice .cta-icon svg{fill:var(--cyan)}

  .cta-auto{
    background:rgba(255,215,0,.05);
    border:1px solid rgba(255,215,0,.18);
    color:var(--gold);
  }
  .cta-auto:hover{border-color:var(--gold);box-shadow:var(--glow-gold)}
  .cta-auto::before{background:linear-gradient(135deg,rgba(255,215,0,.06),transparent)}
  .cta-auto .cta-icon{background:rgba(255,215,0,.1)}
  .cta-auto .cta-icon svg{fill:var(--gold)}

  .cta-sell{
    background:rgba(0,255,136,.05);
    border:1px solid rgba(0,255,136,.18);
    color:var(--green);
  }
  .cta-sell:hover{border-color:var(--green);box-shadow:0 0 20px rgba(0,255,136,.3)}
  .cta-sell::before{background:linear-gradient(135deg,rgba(0,255,136,.06),transparent)}
  .cta-sell .cta-icon{background:rgba(0,255,136,.1)}
  .cta-sell .cta-icon svg{fill:var(--green)}

  .cta-prop{
    background:rgba(168,85,247,.05);
    border:1px solid rgba(168,85,247,.18);
    color:#a855f7;
  }
  .cta-prop:hover{border-color:#a855f7;box-shadow:0 0 20px rgba(168,85,247,.3),0 0 60px rgba(168,85,247,.1)}
  .cta-prop::before{background:linear-gradient(135deg,rgba(168,85,247,.06),transparent)}
  .cta-prop .cta-icon{background:rgba(168,85,247,.1)}
  .cta-prop .cta-icon svg{fill:#a855f7}

  .cta-show{
    background:rgba(255,42,42,.05);
    border:1px solid rgba(255,42,42,.18);
    color:var(--red);
  }
  .cta-show:hover{border-color:var(--red);box-shadow:var(--glow-red)}
  .cta-show::before{background:linear-gradient(135deg,rgba(255,42,42,.06),transparent)}
  .cta-show .cta-icon{background:rgba(255,42,42,.1)}
  .cta-show .cta-icon svg{fill:var(--red)}

  .cta-cut{
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.12);
    color:#ccc;
  }
  .cta-cut:hover{border-color:rgba(255,255,255,.4);box-shadow:0 0 20px rgba(255,255,255,.1)}
  .cta-cut::before{background:linear-gradient(135deg,rgba(255,255,255,.04),transparent)}
  .cta-cut .cta-icon{background:rgba(255,255,255,.06)}
  .cta-cut .cta-icon svg{fill:#ccc}

  .cta-17k{
    background:linear-gradient(135deg,rgba(255,215,0,.08),rgba(255,42,42,.05));
    border:1px solid rgba(255,215,0,.25);
    color:var(--gold);
    position:relative;
  }
  .cta-17k:hover{border-color:var(--gold);box-shadow:var(--glow-gold)}
  .cta-17k::before{background:linear-gradient(135deg,rgba(255,215,0,.08),transparent)}
  .cta-17k .cta-icon{background:rgba(255,215,0,.12)}
  .cta-17k .cta-icon svg{fill:var(--gold)}
  .cta-17k .pulse-dot{
    position:absolute;
    top:12px;right:14px;
    width:8px;height:8px;
    background:var(--gold);
    border-radius:50%;
    animation:blink 1.5s ease-in-out infinite;
  }

  .cta-sync{
    background:rgba(56,189,248,.05);
    border:1px solid rgba(56,189,248,.18);
    color:#38bdf8;
  }
  .cta-sync:hover{border-color:#38bdf8;box-shadow:0 0 20px rgba(56,189,248,.3),0 0 60px rgba(56,189,248,.1)}
  .cta-sync::before{background:linear-gradient(135deg,rgba(56,189,248,.06),transparent)}
  .cta-sync .cta-icon{background:rgba(56,189,248,.1)}
  .cta-sync .cta-icon svg{fill:#38bdf8}

  .cta-full{
    background:rgba(251,146,60,.05);
    border:1px solid rgba(251,146,60,.18);
    color:#fb923c;
  }
  .cta-full:hover{border-color:#fb923c;box-shadow:0 0 20px rgba(251,146,60,.3),0 0 60px rgba(251,146,60,.1)}
  .cta-full::before{background:linear-gradient(135deg,rgba(251,146,60,.06),transparent)}
  .cta-full .cta-icon{background:rgba(251,146,60,.1)}
  .cta-full .cta-icon svg{fill:#fb923c}

  /* CREDENTIAL BAR */
  .cred-bar{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-bottom:22px;
    flex-wrap:wrap;
    animation:fadeIn 1.8s ease both;
  }
  .cred{
    display:flex;
    align-items:center;
    gap:5px;
    font-size:.7rem;
    color:var(--dim);
    letter-spacing:1px;
    text-transform:uppercase;
  }
  .cred-dot{
    width:4px;height:4px;
    background:var(--cyan);
    border-radius:50%;
    opacity:.5;
  }

  /* FOOTER */
  .footer{
    margin-top:auto;
    padding-top:20px;
    text-align:center;
    animation:fadeIn 2s ease both;
  }
  .footer a{
    color:var(--dim);
    text-decoration:none;
    font-size:.65rem;
    letter-spacing:2px;
    text-transform:uppercase;
    transition:color .3s;
  }
  .footer a:hover{color:var(--cyan)}
  .footer .copy{
    font-size:.6rem;
    color:rgba(255,255,255,.15);
    margin-top:8px;
    letter-spacing:1px;
  }

  /* ANIMATIONS */
  @keyframes fadeIn{
    from{opacity:0;transform:translateY(12px)}
    to{opacity:1;transform:translateY(0)}
  }
  .cta-stack .cta-btn:nth-child(1){animation:fadeIn 1.4s ease both}
  .cta-stack .cta-btn:nth-child(2){animation:fadeIn 1.5s ease both}
  .cta-stack .cta-btn:nth-child(3){animation:fadeIn 1.6s ease both}
  .cta-stack .cta-btn:nth-child(4){animation:fadeIn 1.7s ease both}
  .cta-stack .cta-btn:nth-child(5){animation:fadeIn 1.8s ease both}
  .cta-stack .cta-btn:nth-child(6){animation:fadeIn 1.9s ease both}
  .cta-stack .cta-btn:nth-child(7){animation:fadeIn 2.0s ease both}
  .cta-stack .cta-btn:nth-child(8){animation:fadeIn 2.1s ease both}
  .cta-stack .cta-btn:nth-child(9){animation:fadeIn 2.2s ease both}

  /* RESPONSIVE */
  @media(min-width:480px){
    .hub{padding-top:48px}
    .name{font-size:1.8rem}
  }
  @media(min-width:768px){
    .hub{max-width:480px;padding-top:60px}
  }

  /* CLICK RIPPLE */
  .ripple{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,.15);
    transform:scale(0);
    animation:rippleOut .6s ease-out;
    pointer-events:none;
  }
  @keyframes rippleOut{to{transform:scale(4);opacity:0}}
</style>

</head>
